  tls:
    host: ensurance.com.au
    subject: CN=ensurance.com.au
    issuer: "C=US, O=Let's Encrypt, CN=E5"
    notBefore: '2025-06-28'
    notAfter: '2025-09-26'
    expired: true
    note: >-
      Certificate expired 2025-09-26 and has not been renewed. Any client with
      default verification fails to connect to the primary domain.
  specifications:
    openapi:
      found: false
      count: 0
      note: >-
        No OpenAPI or Swagger document was found. Candidate paths /openapi.json,
        /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /spec and /redoc
        were probed on the live redirect target and all returned 404. A 1,520-URL
        Wayback CDX sweep of ensurance.com.au and all its subdomains returned zero
        hits for api, developer, swagger, openapi or graphql paths. The openapi/
        directory is therefore deliberately absent from this repository.
    asyncapi:
      found: false
    graphql:
      found: false
      note: No /graphql surface exists on any resolving Ensurance hostname.
    grpc:
      found: false
      note: No published .proto files.
    postman:
      found: false
      note: No public Postman collection or workspace attributable to Ensurance.
  acordPosture: no ACORD reference found
  acordEvidence: >-
    Case-insensitive search for ACORD, AL3, "ACORD XML", NGDS and IVANS across the
    complete 1,520-entry Wayback CDX index for ensurance.com.au and its subdomains
    returned zero matches, and the live Chase Underwriting site names no ACORD
    standard, agency-download feed, or agency-management-system integration
    (Insight, Sunrise Exchange, SCTP, Ebix). Australian construction-lines
    wholesale distribution here ran on a proprietary web portal, not on a
    standards-based interchange.
  insuranceVerbs:
    quote:
      exposed: false
      surface: >-
        Historic only, and human-facing. Quote/proposal creation existed at
        bob.ensurance.com.au/Proposal/New/3 behind a session login, reachable by
        broker code (e.g. /Proposal/New/3/Agent/SHC). Agent-facing, never
        programmatic. Host now offline.
    bind:
      exposed: false
      surface: Same login-walled BOB wizard; no programmatic bind.
    issue:
      exposed: false
      surface: No policy-issuance API documented at any point.
    fnol:
      exposed: false
      surface: >-
        No claims or first-notice-of-loss API. Chase Underwriting, the current
        destination, routes claims through a Claims page and direct contact with
        regional underwriters.
    audience: partner-only
  authModel:
    public: none
    note: >-
      No public authentication scheme is documented: no API key issuance, no OAuth2
      client-credentials or authorization-code flow, no mTLS, no SAML federation
      published. The historic BOB portal used form-based ASP.NET MVC session login
      at /Login/Login. Neither /.well-known/openid-configuration nor
      /.well-known/oauth-authorization-server is served by any Ensurance or Chase
      hostname (404).
  webhooks:
    found: false
    note: >-
      No event catalogue, webhook documentation or AsyncAPI definition. Consistent
      with the sector; recorded as a finding, not fabricated.
  transports:
    - protocol: REST
      documented: false
      note: No public REST API is documented for Ensurance in any market.
    - protocol: HTTPS web portal
      documented: true
      note: >-
        The only historic machine-reachable surface was the BOB broker portal, an
        HTML/session-login quote-and-proposal application. Human-facing.
      gated: true
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
    - protocol: WebSocket
      documented: false
    - protocol: ACORD AL3 / ACORD XML
      documented: false
      note: No ACORD transport of any generation is referenced.
  corporate:
    legalName: Ensurance Limited
    listing: ASX:ENA
    headquarters: Perth, Western Australia
    homeMarket: Australia
    secondaryMarket: United Kingdom
    auEntity: Ensurance Underwriting Australia — Australian underwriting agency, AFSL holder
    ukEntity: >-
      Ensurance UK Limited — Managing General Agent authorised and regulated by the
      Financial Conduct Authority; coverholder at Lloyd's
    linesOfBusiness:
      - Licensed Builder Annual Construction, Plant and Liability insurance
      - Licensed Builder Project-Specific Construction insurance
      - Trades Liability insurance
      - Owner Builder insurance
      - Home and Contents insurance
    capacityPartners:
      - Lloyd's
      - Swiss Re
      - XL Catlin
    distribution: >-
      Wholesale, via intermediaries only. Company materials cite a 340-plus broker
      network for the Australian book.
    currentStatus: >-
      Domain estate now redirects wholly to Chase Underwriting Solutions Pty Ltd
      (ABN 50 156 554 808, AFSL 454344), an Australian professional-lines
      underwriting agency. The redirect is the observed fact recorded here; no
      transaction terms are asserted.
  marketContext: >-
    Australia has the legal machinery for open insurance and no live obligation.
    APRA supervises prudentially, and the Consumer Data Right that already opened
    banking and energy was designated to extend to general insurance and then
    deferred and de-prioritised. General insurers and underwriting agencies
    therefore face no forcing function to publish an API. Ensurance is a clean
    illustration: a company that positioned itself as "innovating the online
    insurance sector" and still shipped its entire intermediary experience as a
    login-walled web portal with no API, no specification and no ACORD posture.
