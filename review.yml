aid: ensurance
name: Ensurance
review:
  question: Does Ensurance expose a real, self-serve public API surface for its Australian insurance business?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  gated: true
  portalConfirmed: false
  openapiHarvested: false
  specsCount: 0
findings:
  summary: |
    Ensurance Limited (ASX:ENA) was a Perth-based, ASX-listed Australian insurance
    underwriting agency with a UK Managing General Agent subsidiary. It publishes
    no public API and — on the evidence of 1,520 archived URLs plus a live probe
    of the whole domain family — never did.

    As of 2026-07-25 the primary domain is not serving its own content. The
    ensurance.com.au TLS certificate (Let's Encrypt E5, CN=ensurance.com.au)
    expired 2025-09-26, and every path probed on the host returns HTTP 301 from
    nginx/1.26.2 to a single Chase Underwriting Solutions page. The parallel
    ensurance.ltd domain behaves identically.

    No developer portal exists. Two hostnames whose names suggest one —
    api.ensurance.ltd and developer.ensurance.ltd — do return HTTP 200, but each
    serves a byte-identical 4,126-byte default Bootstrap landing template titled
    "Tapanko - Making Complex Tasks Easy", the same body returned by a randomly
    generated control hostname on the same domain. This is wildcard DNS with an
    unconfigured nginx default, not a developer surface, and it is recorded here
    so the 200 status is never mistaken for a portal.

    The company's only ever integration surface was BOB (bob.ensurance.com.au),
    which Ensurance marketing described as a "customised online platform" giving
    intermediaries "fast, simple, reliable and comprehensive construction
    insurance." The archived structure shows an ASP.NET MVC quote-and-proposal
    wizard behind /Login/Login, with per-agent deep links of the form
    /Proposal/New/3/Agent/{AGENTCODE}. That is a session-login agent portal —
    category (b), a login wall — not an API. bob., partner. and euw.
    ensurance.com.au no longer resolve.

    No ACORD, AL3, ACORD XML, NGDS or IVANS reference occurs anywhere in the live
    or archived Ensurance web estate, nor on the Chase Underwriting site that now
    receives its traffic. Absence of an ACORD posture in an Australian
    construction-lines underwriting agency is itself the finding: Australia has
    APRA prudential supervision and a Consumer Data Right that was designated to
    extend to general insurance and then deferred, so there is no mandate and no
    market convention forcing machine-readable interchange here.

    Note on identity hygiene: github.com/ensurance is an unrelated organisation
    (contact opensource@howtohireme.ru, two repositories, last updated 2018) and
    is deliberately NOT attributed to this company.
