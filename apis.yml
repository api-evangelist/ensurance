common:
- type: DomainSecurity
  url: security/ensurance-domain-security.yml
  name: Ensurance Domain Security Probe
  description: >-
    Probed TLS/HSTS/DNSSEC/CAA/SPF/DMARC for the Ensurance and Chase
    Underwriting hosts. ensurance.com.au and 3rdp.ensurance.com.au both fail
    certificate verification (expired 2025-09-26); no DNSSEC, no CAA and no
    DMARC record on ensurance.com.au.
- type: Conformance
  url: conformance/ensurance-conformance.yml
  name: Ensurance Standards Conformance
  description: >-
    Evidenced negatives across OpenAPI, AsyncAPI, GraphQL, gRPC, OAuth2, OIDC,
    RFC 9457, RFC 9116, RFC 8594 and the insurance interchange standards
    (ACORD AL3 / ACORD XML / NGDS / IVANS), plus the Australian CDR general
    insurance designation-then-deferral context.
- type: Lifecycle
  url: lifecycle/ensurance-lifecycle.yml
  name: Ensurance Lifecycle
  description: >-
    No API lifecycle exists; this records the estate lifecycle instead —
    certificate expiry 2025-09-26, blanket 301 of the whole domain family to
    Chase Underwriting, the retired BOB/partner/euw hosts, and the surviving
    3RDP host. No status page and no deprecation policy are published.
- type: Packages
  url: packages/ensurance-packages.yml
  name: Ensurance Packages
  description: >-
    No first-party SDK, client library or CLI in any registry — Ensurance had
    no public API to wrap. Documents the "ensurance" homonym trap: unrelated
    assertion/validation libraries hold the name on npm, PyPI, RubyGems and
    Packagist and must not be attributed to this company.
- type: LLMsTxt
  url: llms/ensurance-llms.txt
  name: Ensurance llms.txt
  description: >-
    Generated llms.txt summarising this record for AI consumers, including the
    redirect false-positive warning and links to every artifact in the repo.
- type: Website
  url: https://ensurance.com.au/
  name: Ensurance Website
  description: >-
    Primary domain. TLS certificate expired 2025-09-26; every path returns
    HTTP 301 (nginx/1.26.2) to Chase Underwriting Solutions. Probed 2026-07-25.
- type: Website
  url: https://www.chaseunderwriting.com.au/capabilities/professional-risks/
  name: Chase Underwriting Solutions (redirect target)
  description: >-
    HTTP 200. The live destination of every ensurance.com.au and ensurance.ltd
    request as of 2026-07-25. Chase Underwriting Solutions Pty Ltd, ABN 50 156
    554 808, AFSL 454344 — an Australian professional-lines underwriting agency.
    Publishes no API, no developer portal and no ACORD reference.
- type: Website
  url: https://3rdp.ensurance.com.au/
  name: 3RDP Remote Platform
  description: >-
    HTTP 200. The only ensurance.com.au hostname still serving its own content.
    "3RDP | Innovative Remote Platform" describes an internal secure remote-desktop
    and VPN environment for staff. Not an insurance API surface.
